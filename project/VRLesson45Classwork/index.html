<html>
  <head>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="lamp.js"></script>
    <script src="script.js"></script>
  </head>
  <body>
    <a-scene light="defaultLightsEnabled: false">
      <!-- Challenge: Add low intensity ambient light to the world -->
      <a-light type="ambient" intensity="0.5"></a-light>

      <!-- Challenge: Allow the plane to receive shadows -->
      <a-plane position="0 0 -5" rotation="-90 0 0" width="20" height="20" color="#7BC8A4" shadow="receive: true"></a-plane>
      <a-sky color="#ff8a35"></a-sky>
      <a-camera position="0 1.6 5">
        <a-cursor/>      
      </a-camera>
    </a-scene>
  </body>
</html>
